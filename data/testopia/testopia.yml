markdown: >-
  ## Overview


  Testopia collaborates with Bugzilla to provide a test case management system
  driven by a database. The tool provides a unified way to track defects and
  manage tests to make team workflows around Bugzilla as simple as possible.


  ## Features


  - Bugzilla integrated interface for defect and test management in one location

  - Database driven architecture for data integrity

  - Easy sharing of test cases and organization through categories and priority

  - Advanced reporting and custom queries against data in another location or
  instance

  - Test run management with execution tracking with detail

  - User permission system that mimics Bugzilla permission

  - API access for custom integration

  - Bulk operations for managing test cases


  ## Use Case


  Testopia is perfect for teams using the Bugzilla infrastructure who would like
  to incorporate test management without introducing another tool. This
  integration is most helpful in team environments where test management and
  defect tracking want to be tightly integrated to provide shared visibility.


  ## Deployment


  Web-based


  ## Pricing


  Free, fully open source.


  ## License


  Open source (GPL)
