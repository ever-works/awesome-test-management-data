name: "Kiwi TCMS"
description: "Kiwi TCMS is an open-source test case management system with a web interface, supporting test plans, cases, runs, and bug tracking integration. It is self-hosted, written in Python/Django, and offers a REST API for automation. Licensed under GPL-2.0 with active community development."
