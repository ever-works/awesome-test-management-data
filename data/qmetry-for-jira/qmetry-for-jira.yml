markdown: >-
  ## Overview


  QMetry for Jira is a test management platform that integrates directly into
  Jira, allowing QA teams to manage test cases, test cycles, and test execution
  without leaving the Jira environment. It is offered by SmartBear as part of
  its test management portfolio alongside Zephyr.


  ## Features


  - Manual test management within Jira

  - Cross-project reporting and dashboard gadgets

  - BDD (Behavior-Driven Development) support

  - Data residency options for compliance

  - No-code test automation capabilities

  - Traceability across requirements, test cases, and execution results

  - Test versioning and shared test data/parameters

  - Hierarchical folders for test asset organization


  ## Pricing


  Paid commercial product with a free trial available. Contact SmartBear for
  detailed pricing tiers.


  ## Deployment


  Cloud-based deployment as a Jira app/add-on.


  ## Integrations


  Native integration with Jira; compatible with BDD and CI/CD tools.
