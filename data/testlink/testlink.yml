name: "TestLink"
description: "TestLink is a classic open-source test management system providing test specification, execution, and reporting with requirement traceability. It is self-hosted, PHP-based, and supports integration with bug trackers like Bugzilla and Jira. Licensed under GPL with a long history in QA communities."
